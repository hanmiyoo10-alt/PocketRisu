name: Temporary opaque ETag patch builder

on:
  push:
    branches:
      - feat/db-save-optimization-opaque-etag

permissions:
  contents: write

jobs:
  build-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/db-save-optimization-opaque-etag
          fetch-depth: 0

      - name: Apply isolated ETag optimization
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('server/node/server.cjs')
          s = p.read_text()
          old = """            // Update ETag after successful patch (based on stripped version)\n            patchStage = 'etag';\n            if (decodedKey === 'database/database.bin') {\n                dbEtag = computeBufferEtag(Buffer.from(encodeRisuSaveLegacy(dbCache[filePath])));\n            }\n"""
          new = """            // The ETag is only used as an opaque revision token for conflict\n            // detection. Avoid re-encoding and hashing the entire stripped DB\n            // after every successful patch just to mint the next revision.\n            patchStage = 'etag';\n            if (decodedKey === 'database/database.bin') {\n                dbEtag = `rev-${nodeCrypto.randomUUID()}`;\n            }\n"""
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one patch ETag block, found {count}')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Verify syntax and scope
        run: |
          node --check server/node/server.cjs
          grep -F 'dbEtag = `rev-${nodeCrypto.randomUUID()}`;' server/node/server.cjs
          test "$(git diff --name-only | sort)" = "server/node/server.cjs"

      - name: Commit isolated patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/node/server.cjs
          git rm .github/workflows/_tmp-build-opaque-etag.yml
          git commit -m 'perf: avoid full DB encode for patch ETag'
          git push origin HEAD:feat/db-save-optimization-opaque-etag
